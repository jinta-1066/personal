<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混雑状況報告</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #333; }
        .btn { display: block; width: 100%; margin: 10px 0; padding: 20px; font-size: 1.5rem; border: none; border-radius: 10px; cursor: pointer; color: white; }
        .green { background: #28a745; }
        .yellow { background: #ffc107; color: black; }
        .red { background: #dc3545; }
    </style>
</head>
<body>

    <h1 id="place-name">場所を読み込み中...</h1>
    <p>現在の混雑状況を選択して送信してください</p>

    <button class="btn green" onclick="send('vacant')">空いている</button>
    <button class="btn yellow" onclick="send('normal')">普通</button>
    <button class="btn red" onclick="send('congest')">混雑中（行列）</button>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const placeId = urlParams.get('id');
      
      if (placeId) {
        // 正常な場合：場所を表示
        document.getElementById('place-name').innerText = placeId + " 報告ページ";
      } else {
        // エラーの場合：案内を表示
        document.body.innerHTML = `
        <div style="padding: 20px; color: red;">
        <h2>エラー</h2>
        <p>場所が指定されていません。専用のQRコードを読み直してください。</p>
        </div>
        `;
      }

        // 3. 送信処理（GoogleフォームのURLをここに仕込む）
        function send(status) {
            // ここにGoogleフォームの「事前入力URL」をベースにしたURLを作る
            const formId = "YOUR_FORM_ID"; // 自分のフォームIDに書き換え
            const entryIdPlace = "entry.678215901"; // 場所名のentry ID
            const entryIdStatus = "entry.1534147172"; // 状況のentry ID
            
            const googleFormUrl = `https://google.com{formId}/formResponse?${entryIdPlace}=${placeId}&${entryIdStatus}=${status}&submit=Submit`;

            // ページ遷移させずに裏で送信（fetchを使用）
            fetch(googleFormUrl, { mode: 'no-cors' })
                .then(() => alert(placeId + "を「" + status + "」で更新しました！"))
                .catch(() => alert("エラーが発生しました"));
        }
    </script>
</body>
</html>
